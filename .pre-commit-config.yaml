repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.1.9
  hooks:
  - id: ruff
    args: [--fix, --exit-non-zero-on-fix]
  - id: ruff-format
- repo: https://github.com/pre-commit/mirrors-mypy
  rev: v1.8.0
  hooks:
  - id: mypy
    args: [--strict]
    additional_dependencies:
    - pydantic==2.11.9
    - sqlalchemy[mypy]==2.0.43
    - pymongo[mypy]==4.15.3
    - mongoengine==0.29.1
    - pymupdf4llm==0.0.27
    - google-genai==1.49.0
    - dotenv==0.9.9
    - qdrant-client==1.16.0